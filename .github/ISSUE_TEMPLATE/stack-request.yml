name: Stack request
description: Ask for a stack, service or version Govard does not ship yet
title: "stack: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when Govard's built-in stack is close but not what your
        project needs: a service it does not include, a version it pins
        differently, or a PHP extension the images lack.

        The answer decides whether Govard adds a profile, or whether the
        distributable preset work (blueprints) gets scheduled at all.
  - type: input
    id: stack
    attributes:
      label: The stack you need
      description: One line, the shape of it, for example "Magento 2.4.7 with PHP 8.3, Elasticsearch 7.17 and RabbitMQ".
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the built-in stack does not fit
      description: Which service or version is wrong, and what breaks without it.
    validations:
      required: true
  - type: dropdown
    id: shape
    attributes:
      label: What would help most
      options:
        - A built-in profile I can select with one flag
        - A preset I could write and share with my team
        - A way to point at my own compose file
    validations:
      required: true
  - type: input
    id: projects
    attributes:
      label: How many projects would use it
      description: Your own count is enough; "one" is a valid answer and still useful.
