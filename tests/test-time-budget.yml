# Per-test wall-clock budget.
#
# The suite is enormous and almost entirely cheap -- roughly 84% of the unit
# tests finish in under 10ms -- yet its wall clock used to be owned by a small
# tail. Without a rule, a test that goes from 40ms to 4s still passes, nothing
# turns red, and nobody looks at the clock until `make test` takes five minutes.
# This file is that rule: a test running longer than its budget fails the build.
#
# Enforced by scripts/testbudget, which reads the `Elapsed` field that
# `go test -json` already reports for every test. The budget is therefore checked
# during the run it governs, costing no wall time of its own.
#
# Rules for this file:
#
#   1. Every override carries a reason. The tool refuses to load a budget whose
#      override has none. An unexplained allowance is indistinguishable from a
#      test that simply got slow, which is the failure this file exists to stop.
#   2. A missing override is a failing test, not a warning.
#   3. Overrides naming a test that no longer runs are reported as stale on a
#      full-suite run, so a rename cannot leave a precedent behind for whoever
#      writes the next slow test.
#   4. Prefer making a test fast over raising its budget. A budget file that
#      only ever grows is a budget file that stopped working; this one is meant
#      to shrink.
#
# Thresholds were derived from measurement, not taste.
#
#   These are measured against `make test-unit`, which runs the race detector, so
#   they describe -race timings and not raw ones. That distinction is worth the
#   space it takes to state: the same two tests that peak near 2.9s without the
#   detector reach 4.4s with it, and a 5s ceiling derived from the raw numbers left
#   only 13% headroom over a -race run and flaked in practice.
#
#   The unit default sits at 7s with no allowances at all, against a slowest
#   measured test of 4.4s under -race. The process-lifecycle tests that dominate the
#   tail are strikingly stable (2.12s, 2.01s and 3.23s reproduced to within 0.01s
#   across runs) because they wait on conditions rather than on the clock. The two
#   tests that do swing -- the build-parity and prepare-check tests, which move real
#   files -- vary by roughly 2x, so the cap carries real headroom over the observed
#   maximum rather than sitting just above it. A cap that flaps on an ordinary run is
#   a cap people learn to re-run past.
#
#   Integration runs a much wider net: those tests bring up real containers and
#   talk real SSH, so their floor is seconds by nature and the useful signal is an
#   order of magnitude, not a tenth of a second. It does not run the race detector
#   -- it drives the real binary out of process, where the detector would only
#   cover the test harness.
#
# A slower machine (a shared CI runner, a loaded laptop) can set
# GOVARD_TEST_TIME_SCALE=2 to multiply every budget without editing this file.
# It exists so a slow host does not turn this gate into noise people learn to
# ignore -- and so tightening it later is a one-line change rather than a
# re-argument about every individual test.
#
# Every overrun line carries the host load average and CPU count, and a run that
# replayed go test's cache says so plainly: cached timings are from an earlier run,
# not a measurement of this machine. Judge an overrun against both before raising a
# budget; first ask whether the test does real work or is spawning a host tool.
#
# Note which check is which: CI sets the scale to 2, so CI enforces 14s while a
# local run enforces 7s. That makes the *authoritative* gate the looser one, and
# an 8s regression is caught locally and merges clean. The trade is deliberate --
# a gate that flaps on a shared runner trains people to ignore it -- but it is a
# trade, and lowering the scale once the suite is reliably under the ceiling is
# the obvious follow-up.

suites:
  unit:
    # No allowances. The slowest unit test measures 4.4s under -race, and the
    # budget sits well clear of it.
    #
    # Be precise about what this catches: it is an absolute ceiling, not a
    # ratio. A test is in trouble when it *ends up above 7s*, whatever it started
    # at -- so 40ms -> 8s is caught and 40ms -> 4s is not. In practice the second
    # case is rare, because 84% of the suite runs in under 10ms and anything
    # doing real work lands in seconds, but it is a limit worth stating rather
    # than implying otherwise. The "slowest tests" table printed on every run is
    # what covers the band below the ceiling.
    default: 7s
    overrides: {}

  integration:
    # Integration tests drive real containers and real SSH, so the default is
    # much wider. The tail is concentrated too: a test that starts pulling an
    # image on every run should show up against this cap.
    default: 30s
    overrides:
      TestDeploySandboxRunsTheMagentoRecipeOverRealSSH:
        budget: 90s
        reason: >-
          boots a real sandbox container and runs the Magento recipe over real SSH
          for five layouts (single, split, hyva, hyva-multi, in-place), roughly 7-10s
          each. Measured 41.25s, 41.61s and 41.50s on three isolated runs, so the
          old 45s cap left 8% headroom and failed on host load alone (45-157s seen
          in the field). 90s is about twice the quiet-host time: it still fails a
          layout that doubles, but not a busy laptop. A cold sandbox image build
          (157s seen) is outside this budget by design; pre-pull or pre-build the
          image before a timed run.
