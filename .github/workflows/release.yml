name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # The lint image must be published before anything is linked, because
  # the release binaries carry its manifest digest in
  # internal/audit.GovardGlintDigest and only ever reference the official image
  # pinned to that digest. packages: write is granted to `glint-image` (a
  # reusable workflow cannot escalate beyond its calling job's token, so the
  # grant has to live on that job) and to `release` (the GoReleaser dockers
  # publisher pushes GHCR images); the workflow-level block above stays
  # contents: write only and `macos-pkg` never sees it.
  glint-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/audit-glint-image.yml
    with:
      image_tag: ${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: glint-image
    permissions:
      contents: write
      packages: write # GoReleaser dockers publisher pushes GHCR images
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Determine previous stable tag
        id: prev_tag
        run: |
          PREV_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags \
            | grep -v -- '-' \
            | grep -vFx "${GITHUB_REF_NAME}" \
            | head -n1)
          echo "tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.prev_tag.outputs.tag }}
          # Linked into internal/audit.GovardGlintDigest by .goreleaser.yml. An empty value is a valid,
          # degraded state rather than a build failure: ToolchainManager treats
          # it as "no official image pinned" and builds the embedded lint
          # context locally instead.
          GOVARD_GLINT_DIGEST: ${{ needs.glint-image.outputs.image_digest }}

  macos-pkg:
    name: macOS Installer (${{ matrix.arch }})
    needs: release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # serialize: both legs append to the shared release checksums.txt
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build macOS pkg and desktop archive
        run: ./scripts/build-macos-pkg.sh "${GITHUB_REF_NAME}" "${{ matrix.arch }}" dist

      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.pkg dist/*.tar.gz --clobber

      - name: Append checksums for macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" -p checksums.txt -O dist/checksums.txt --clobber
          (cd dist && shasum -a 256 *.tar.gz >> checksums.txt)
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt --clobber

  # Publishes the thin installer wrapper (npm/) as @ddtcorex/govard.
  # Stable tags only: prerelease tags contain "-" (e.g. v1.71.0-beta.1)
  # and skip this job, matching the repo's beta-channel policy.
  npm-publish:
    name: npm wrapper (@ddtcorex/govard)
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Stamp wrapper version from tag
        run: node -e "const fs=require('fs');const p='npm/package.json';const j=JSON.parse(fs.readFileSync(p));j.version='${GITHUB_REF_NAME}'.replace(/^v/,'');fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"

      - name: Smoke-test wrapper logic
        run: node ./npm/test-install.mjs

      - name: Publish
        run: npm publish ./npm --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_AUTH }}
