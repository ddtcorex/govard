PasswordAuthentication no
KbdInteractiveAuthentication no
# prohibit-password, not no: every routed account shares UID 0 (see
# entrypoint.sh), and sshd treats any UID-0 login as a root login -- with
# "no" it refuses even a valid-key login ("ROOT LOGIN REFUSED"). Password
# and keyboard-interactive auth are already disabled above, so
# prohibit-password only permits exactly what this gateway uses: pubkey.
PermitRootLogin prohibit-password
PubkeyAuthentication yes
AuthorizedKeysFile none
AuthorizedKeysCommand /usr/local/bin/authorized-keys-command.sh %u
AuthorizedKeysCommandUser nobody
PermitUserEnvironment no
PrintMotd no
PrintLastLog no
