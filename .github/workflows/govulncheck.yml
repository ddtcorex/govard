name: Go Vulnerability and Dependency Audit

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The `go` directive in go.mod is the toolchain floor *and* the exact
      # version this installs, so it must name a patched release: with `go
      # 1.25.0` setup-go installs 1.25.0 verbatim, and the standard library of
      # an unpatched release carries CVEs that are already fixed in later
      # patches of the same minor. Every workflow that reads go.mod — this one,
      # codeql, release (twice) and audit-glint-image — builds with whatever
      # this resolves to.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      # The text report is what the gate reads and what a human needs: the SARIF
      # file is machine-only, so a run that failed on a real finding used to say
      # nothing about *which* finding. The default (non-verbose) report lists a
      # `Vulnerability #N:` block only for findings whose code path reaches this
      # repository; the imported-but-uncalled ones are counted at the end.
      #
      # govulncheck is PINNED, and the pin is load-bearing rather than tidiness.
      # It reports the standard-library CVEs of the toolchain it RUNS ON, not of
      # this module's floor, and Go's automatic toolchain switching hands it the
      # minimum that satisfies x/vuln's own `go` requirement. x/vuln v1.10.0
      # requires go 1.26.0 while this module's floor is 1.27.4, so the scan runs
      # on the patched toolchain go.mod asks for. A pin whose requirement is
      # newer than our floor would drag in that unpatched minimum instead, which
      # is how this job once went red for 19 stdlib CVEs. Bump the pin together
      # with the go directive, and check `go` in x/vuln's own go.mod.
      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -format text ./... \
            > govulncheck.txt 2>&1 || true
          cat govulncheck.txt

      - name: Gate on findings
        run: bash scripts/govulncheck-gate.sh govulncheck.txt

      # The dependency audit rides on this weekly run because it needs the module
      # proxy and answers the same question from the other side: is the stack
      # still at the newest stable release, and does every hold still suppress
      # something? It fails only when a declared hold has gone stale, so an
      # upstream outage or a genuinely outdated dependency is a report, not a red
      # job. A hold that no longer holds fails loudly here, because that is the
      # moment someone has to re-read internal/depsaudit/holds.json.
      - name: Audit dependency holds
        run: go run ./scripts/depsaudit

      - name: Build SARIF report
        if: always()
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -format sarif ./... \
            > govulncheck.sarif || true

      # Uploaded even when the gate failed, so an accepted or newly discovered
      # finding reaches code scanning instead of only the job log.
      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govulncheck.sarif
