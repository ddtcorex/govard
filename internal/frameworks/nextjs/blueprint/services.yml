# Next.js Docker Compose configuration
# This is the main Docker Compose file for Next.js projects

{{ $cache := .Config.Stack.Services.Cache }}
{{ $cacheVersion := .Config.Stack.CacheVersion }}
{{ $queue := .Config.Stack.Services.Queue }}
{{ $queueVersion := .Config.Stack.QueueVersion }}

services:
  web:
    image: node:{{ .Config.Stack.NodeVersion }}
    working_dir: /app
    user: root
    volumes:
      - .:/app
      - next-cache:/app/.next
      {{ if .HostGovardRootCAPath }}
      - "{{ .HostGovardRootCAPath }}:/usr/local/share/ca-certificates/govard.crt:ro"
      {{ end }}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mail:host-gateway"
      {{ range .RuntimeDomainHosts }}
      - "{{ . }}"
      {{ end }}
    command: >
      sh -lc '
        { command -v update-ca-certificates >/dev/null || { apt-get update && apt-get install -y --no-install-recommends ca-certificates; }; } &&
        update-ca-certificates &&
        {{ nextjsRuntimeCommand }}
      '
    environment:
      - NODE_ENV=development
      - PORT=80
      - NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/govard.crt
    networks:
      - govard-net
      - govard-proxy

networks:
  govard-net:
    driver: bridge
  govard-proxy:
    external: true

volumes:
  next-cache:
