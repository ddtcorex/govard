map $http_cookie $fastcgi_backend {
    default php:9000;
    ~*XDEBUG_SESSION=${XDEBUG_SESSION_PATTERN} php-debug:9000;
}

resolver 127.0.0.11 ipv6=off valid=30s;


server {
    listen 80;
    server_name _;
    root ${CONVENTIONS_WORK_DIR}${NGINX_PUBLIC};

    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass $fastcgi_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS 'on';
    }

    # PrestaShop's "friendly URL" product/category image rewrites, e.g.
    # /8-8-product-name/product.jpg -> /img/p/8/8.jpg (and similarly for
    # category 'c', manufacturer 'm', and supplier 'su' image buckets).
    location ~* ^/([0-9]+)(-[a-zA-Z0-9_-]*)?/([a-zA-Z0-9_-]*)\.jpg$ {
        rewrite "^/([0-9])(-[a-zA-Z0-9_-]*)?/.*\.jpg$" /img/p/$1/$1.jpg last;
        rewrite "^/([0-9])([0-9])(-[a-zA-Z0-9_-]*)?/.*\.jpg$" /img/p/$1/$2/$1$2.jpg last;
        rewrite "^/([0-9])([0-9])([0-9])(-[a-zA-Z0-9_-]*)?/.*\.jpg$" /img/p/$1/$2/$3/$1$2$3.jpg last;
        rewrite "^/c/([0-9]+)(-[a-zA-Z0-9_-]*)?/.*\.jpg$" /img/c/$1.jpg last;
        return 404;
    }

    location ~* \.(?:css|js|jpeg|gif|png|svg|ico|webp)$ {
        expires 30d;
        access_log off;
    }
    ${NGINX_CUSTOM_INCLUDE}
}
