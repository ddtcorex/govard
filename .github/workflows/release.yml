name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Determine previous stable tag
        id: prev_tag
        run: |
          PREV_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags \
            | grep -v -- '-' \
            | grep -vFx "${GITHUB_REF_NAME}" \
            | head -n1)
          echo "tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean --previous-tag=${{ steps.prev_tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-pkg:
    name: macOS Installer (${{ matrix.arch }})
    needs: release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # serialize: both legs append to the shared release checksums.txt
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build macOS pkg and desktop archive
        run: ./scripts/build-macos-pkg.sh "${GITHUB_REF_NAME}" "${{ matrix.arch }}" dist

      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.pkg dist/*.tar.gz --clobber

      - name: Append checksums for macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" -p checksums.txt -O dist/checksums.txt --clobber
          (cd dist && shasum -a 256 *.tar.gz >> checksums.txt)
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt --clobber
