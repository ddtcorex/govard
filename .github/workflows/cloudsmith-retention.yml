name: CloudSmith Retention

# Free-tier CloudSmith has no Retention UI section (owner-confirmed), so this
# workflow enforces keep-last-N per package instead: monthly cron + manual
# dispatch. Dry-run by default — pass live=true to actually delete.
# Deletes address individual versions by their immutable slug_perm, never by
# package name, so a bug can at worst remove one version, not a package.

on:
  schedule:
    - cron: "0 3 1 * *" # monthly, 10:00 ICT
  workflow_dispatch:
    inputs:
      live:
        description: "Actually delete old versions (default dry-run)"
        type: boolean
        default: false
      keep_last:
        description: "Versions to keep per package"
        default: "5"

permissions:
  contents: read

env:
  OWNER: ddtcorex
  REPOS: govard-deb govard-rpm govard-apk

jobs:
  retention:
    name: Prune old package versions
    runs-on: ubuntu-latest
    steps:
      - name: Install CloudSmith SDK
        run: pip install --quiet cloudsmith-api

      - name: Run retention
        run: |
          python3 - <<'EOF'
          import os
          import cloudsmith_api

          owner = os.environ["OWNER"]
          repos = os.environ["REPOS"].split()
          keep_last = int(os.environ.get("KEEP_LAST", "5"))
          live = os.environ.get("LIVE", "false").lower() == "true"

          config = cloudsmith_api.Configuration()
          config.api_key["X-Api-Key"] = os.environ["CLOUDSMITH_API_KEY"]
          packages = cloudsmith_api.PackagesApi(
              cloudsmith_api.ApiClient(config)
          )

          import re

          def version_key(version):
              # "1.72.0-beta.11" -> ((1,72,0),(0,11)); "1.72.0" -> ((1,72,0),(1,))
              # Debian revisions rewrite the separator (dry-runs found
              # "beta.11-0~beta" and tilde-style "1.72.0~beta11"), so parse
              # leading numerics + first beta marker anywhere in the string.
              nums = tuple(
                  int(p) for p in re.match(r"^(\d+(?:\.\d+)*)", version).group(1).split(".")
              )
              m = re.search(r"beta\.?(\d+)", version)
              if m:
                  return (nums, (0, int(m.group(1))))
              return (nums, (1,))

          deleted = 0
          for repo in repos:
              items = packages.packages_list(owner, repo, page_size=100)
              # Group by package NAME: every upload mints a unique slug
              # (dry-run showed one slug per file), so slug-grouping would
              # never delete. Keep the newest keep_last DISTINCT versions
              # per name, all files of those versions included.
              by_name = {}
              for pkg in items:
                  by_name.setdefault(pkg.name, []).append(pkg)
              for name, files in sorted(by_name.items()):
                  versions = sorted(
                      {p.version for p in files}, key=version_key
                  )
                  keep = set(versions[-keep_last:])
                  print(f"VERSIONS {repo}/{name}: {', '.join(versions)}")
                  for pkg in sorted(files, key=lambda p: version_key(p.version)):
                      if pkg.version in keep:
                          continue
                      if live:
                          packages.packages_delete(owner, repo, pkg.slug_perm)
                          deleted += 1
                          print(f"DELETED {repo}/{name} {pkg.version}")
                      else:
                          print(f"WOULD-DELETE {repo}/{name} {pkg.version}")
          print(f"mode={'LIVE' if live else 'DRY-RUN'} deleted={deleted}")
          EOF
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          LIVE: ${{ inputs.live || 'false' }}
          KEEP_LAST: ${{ inputs.keep_last || '5' }}
