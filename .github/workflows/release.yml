name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # The Magento lint image must be published before anything is linked, because
  # the release binaries carry its manifest digest in
  # internal/audit.GovardMagelintDigest and only ever reference the official image
  # pinned to that digest. packages: write is granted here and nowhere else: a
  # reusable workflow cannot escalate beyond its calling job's token, so the grant
  # has to live on this job, while the workflow-level block above stays
  # contents: write only and neither `release` nor `macos-pkg` ever sees it.
  magelint-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/audit-magelint-image.yml
    with:
      image_tag: ${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: magelint-image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Determine previous stable tag
        id: prev_tag
        run: |
          PREV_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags \
            | grep -v -- '-' \
            | grep -vFx "${GITHUB_REF_NAME}" \
            | head -n1)
          echo "tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.prev_tag.outputs.tag }}
          # Linked into internal/audit.GovardMagelintDigest by .goreleaser.yml.
          # An empty value is a valid, degraded state rather than a build failure:
          # ToolchainManager treats it as "no official image pinned" and builds the
          # embedded lint context locally instead.
          GOVARD_MAGELINT_DIGEST: ${{ needs.magelint-image.outputs.image_digest }}

  macos-pkg:
    name: macOS Installer (${{ matrix.arch }})
    needs: release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # serialize: both legs append to the shared release checksums.txt
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build macOS pkg and desktop archive
        run: ./scripts/build-macos-pkg.sh "${GITHUB_REF_NAME}" "${{ matrix.arch }}" dist

      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.pkg dist/*.tar.gz --clobber

      - name: Append checksums for macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" -p checksums.txt -O dist/checksums.txt --clobber
          (cd dist && shasum -a 256 *.tar.gz >> checksums.txt)
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt --clobber
