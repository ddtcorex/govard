networks:
    govard-net:
        driver: bridge
    govard-proxy:
        external: true
services:
    db:
        environment:
            - POSTGRES_DB=dagster
            - POSTGRES_USER=dagster
            - POSTGRES_PASSWORD=dagster
        image: postgres:16
        networks:
            - govard-net
        volumes:
            - db-data:/var/lib/postgresql/data
    web:
        command: |
            sh -lc '
              { command -v update-ca-certificates >/dev/null || { apt-get update && apt-get install -y --no-install-recommends ca-certificates; }; } &&
              update-ca-certificates &&
              pip install --no-cache-dir -r requirements.txt &&
              chown -R "$(stat -c %u:%g .)" . 2>/dev/null;
              mkdir -p "$$DAGSTER_HOME" && { [ ! -f dagster.yaml ] || cp dagster.yaml "$$DAGSTER_HOME/dagster.yaml"; } &&
              dagster dev -w workspace.yaml -h 0.0.0.0 -p 80
            '
        depends_on:
            - db
        environment:
            - DAGSTER_HOME=/dagster_home
            - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
            - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
            - POSTGRES_HOST=db
            - POSTGRES_PORT=5432
            - POSTGRES_DB=dagster
            - POSTGRES_USER=dagster
            - POSTGRES_PASSWORD=dagster
        extra_hosts:
            - host.docker.internal:host-gateway
        image: python:3.12-slim
        networks:
            - govard-net
            - govard-proxy
        user: root
        volumes:
            - .:/app
            - dagster-home:/dagster_home
        working_dir: /app
volumes:
    dagster-home: null
    db-data: null
