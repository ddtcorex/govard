version: 2
updates:
  # GitHub Actions only, by design: Go modules ride the existing
  # govulncheck/manual flow, Docker bases stay hand-pinned for
  # reproducible builds (see AGENTS.md "Version Truth").
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # goreleaser-action stays on the v6 pin: the v7 SHA breaks GitHub's
    # startup fetch (zero-job runs, proven by probe + beta.7, reverted in
    # f142245). Ignore majors so the bot stops re-proposing it; revisit
    # only with a branch-level probe run first (see release.yml comment).
    ignore:
      - dependency-name: goreleaser/goreleaser-action
        update-types: ["version-update:semver-major"]
