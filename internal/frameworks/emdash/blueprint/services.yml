# EmDash Docker Compose configuration.
# Note: this blueprint is rendered through Go templates, so the raw source is
# not expected to be standalone YAML before Govard renders it.

services:
  web:
    image: node:{{ .Config.Stack.NodeVersion }}
    working_dir: /app
    user: root
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      {{ if .HostGovardRootCAPath }}
      - "{{ .HostGovardRootCAPath }}:/usr/local/share/ca-certificates/govard.crt:ro"
      {{ end }}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mail:host-gateway"
      {{ range .RuntimeDomainHosts }}
      - "{{ . }}"
      {{ end }}
    command: >
      sh -lc '
        { command -v update-ca-certificates >/dev/null || { apt-get update && apt-get install -y --no-install-recommends ca-certificates; }; } &&
        update-ca-certificates &&
        {{ emdashRuntimeCommand .PackageManager .Config.Domain }}
      '
    environment:
      - GOVARD_TRUSTED_DOMAIN={{ .Config.Domain }}
      - NODE_ENV=development
      - PORT=80
      - NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/govard.crt
    networks:
      - govard-net
      - govard-proxy

volumes:
  node-modules:

networks:
  govard-net:
    driver: bridge
  govard-proxy:
    external: true
