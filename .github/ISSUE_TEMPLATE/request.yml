name: Framework or Stack Request
description: Ask Govard to detect a framework, add a service or version, or publish a stack preset.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for stack coverage: a framework Govard does not detect, a
        service or version it does not ship, or a blueprint preset you want to
        publish or see published.

        For anything that is not about the stack, use the Feature Request form.

  - type: dropdown
    id: kind
    attributes:
      label: What are you asking for?
      options:
        - Framework support (Govard should detect and run this stack)
        - A service, version or PHP extension the images lack
        - Blueprint preset (a stack variant others can install)
    validations:
      required: true

  - type: input
    id: stack
    attributes:
      label: Stack and version
      description: Framework and version, for example Magento 2.4.7, Laravel 11, WordPress 6.7
      placeholder: Magento 2.4.7 with PHP 8.3, Elasticsearch 7.17 and RabbitMQ
    validations:
      required: true

  - type: textarea
    id: blocked
    attributes:
      label: What Govard does today
      description: The command you ran, what happened, and what you expected instead.
    validations:
      required: true

  - type: dropdown
    id: shape
    attributes:
      label: What would help most
      description: This decides whether Govard adds a built-in profile, schedules the preset work, or documents the compose escape hatch.
      options:
        - A built-in profile I can select with one flag
        - A preset I could write and share with my team
        - A way to point at my own compose file
        - Not sure yet
    validations:
      required: true

  - type: input
    id: projects
    attributes:
      label: How many projects would use it
      description: Your own count is enough; "one" is a valid answer and still useful.

  - type: textarea
    id: links
    attributes:
      label: Reference links
      description: Framework docs, a compose file, or a repository Govard could use as a reference.
